name: Dependabot auto-merge

# Enables GitHub's native auto-merge (squash) on the Dependabot PRs that
# are safe to land unattended: the npm "patch" group and the
# "github-actions" group. Auto-merge only completes once the required
# status checks pass (the "main" ruleset requires the CI "check" job),
# so a red PR is never merged; it just stays open for a human.
# This workflow never checks out or runs PR code; it only calls the
# GitHub API.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.dependency-group == 'patch' ||
          steps.metadata.outputs.dependency-group == 'github-actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
