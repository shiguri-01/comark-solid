name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp run check

      - name: Build
        run: vp run build

      - name: Install Chromium for browser tests
        run: vp exec playwright install --with-deps --only-shell chromium

      - name: Test
        run: vp run test
