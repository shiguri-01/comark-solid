version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Dependabot does not honour pnpm's minimumReleaseAge, so use its own
    # cooldown to avoid proposing releases that are only a few days old.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group by update type, not dependency type: pnpm catalog entries
      # (vite-plus, vitest, ...) are reported as production dependencies,
      # so a development-only group would miss them.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
